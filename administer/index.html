<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>教务注册管理 · CourseFlow</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="login-screen" class="login-screen" hidden>
    <section class="login-card">
      <div class="brand-mark large">CF</div>
      <p class="eyebrow">COURSE REGISTRATION SYSTEM</p>
      <h1>教务注册管理</h1>
      <p class="muted login-copy">使用注册管理员账户登录，维护人员档案并管理学期注册。</p>
      <form id="login-form" class="form-stack">
        <label>管理员用户名<input name="username" autocomplete="username" required placeholder="registrar.demo"></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label>
        <button class="button primary full" type="submit">登录管理工作台 <span>→</span></button>
      </form>
      <div class="login-hint"><span class="status-dot"></span>演示账号：registrar.demo</div>
    </section>
    <div class="login-side-note">教务 · 注册管理<br><span>统一维护人员档案与注册期</span></div>
  </div>

  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="CourseFlow 首页">
        <span class="brand-mark">CF</span>
        <span class="brand-name">course<span>flow</span><small>REGISTRAR CONSOLE</small></span>
      </a>
      <div class="side-caption">工作台</div>
      <nav id="main-nav" class="main-nav" aria-label="主导航">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>总览</button>
        <button class="nav-item" data-view="students"><span class="nav-icon">♙</span>学生档案<span id="student-nav-count" class="nav-count">0</span></button>
        <button class="nav-item" data-view="professors"><span class="nav-icon">♧</span>教师档案<span id="professor-nav-count" class="nav-count">0</span></button>
        <button class="nav-item" data-view="registration"><span class="nav-icon">▦</span>注册期管理</button>
        <button class="nav-item" data-view="billing"><span class="nav-icon">＄</span>账单队列<span id="billing-nav-count" class="nav-dot" hidden></span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="secure-note"><span class="secure-icon">◈</span><div><b>管理员权限</b><small>变更操作留有审计记录</small></div></div>
        <div class="user-mini">
          <div class="avatar" id="user-avatar">陈</div>
          <div class="user-mini-text"><b id="user-name">教务管理员</b><small>注册管理员</small></div>
          <button id="logout-button" class="icon-button" title="退出登录" aria-label="退出登录">↗</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>CourseFlow</span><b>/</b><strong id="page-crumb">总览</strong></div>
        <div class="topbar-right"><span class="today-label" id="today-label"></span><span class="top-separator"></span><span class="live-status"><i></i>系统在线</span></div>
      </header>
      <div class="content-wrap">
        <div id="loading-state" class="loading-state"><span class="loader"></span>正在读取数据库和课程目录…</div>
        <div id="page-content"></div>
      </div>
    </main>
  </div>

  <dialog id="record-dialog" class="record-dialog">
    <form id="record-form" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow" id="dialog-eyebrow">人员档案</p><h2 id="dialog-title">新增档案</h2></div><button type="button" class="icon-button close-dialog" aria-label="关闭">×</button></div>
      <div id="dialog-fields" class="form-grid"></div>
      <div class="dialog-foot"><button type="button" class="button subtle close-dialog">取消</button><button type="submit" class="button primary">保存档案</button></div>
    </form>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
</body>
</html>
